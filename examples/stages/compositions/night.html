<!doctype html>
<!-- Stage preset "night" with the "poster" type pairing. See skills/direct/references/stages.md. -->
<html lang="en" data-composition-id="night" data-composition-duration="6">
  <head>
    <meta charset="UTF-8" />
    <title>Night</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f2efe9;
          font-family: "Lato", sans-serif;
        }
        #nt-ground {
          position: absolute; inset: 0; z-index: 0;
          background: linear-gradient(168deg, #1a1b1f 0%, #141518 46%, #0d0e10 100%);
        }
        #nt-light {
          position: absolute; left: -200px; top: -260px; width: 1700px; height: 1200px; z-index: 1;
          background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(120, 140, 175, 0.18) 0%, rgba(120, 140, 175, 0) 100%);
        }
        #nt-glow {
          position: absolute; left: 300px; top: -200px; width: 1500px; height: 1100px; z-index: 4;
          opacity: 1; pointer-events: none;
          background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(150, 170, 210, 0.12) 0%, rgba(150, 170, 210, 0) 100%);
        }
        #nt-grain {
          position: absolute; inset: 0; z-index: 5; pointer-events: none;
          opacity: 0.1; mix-blend-mode: screen; background-size: 320px 320px;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.8  0 0 0 0 0.82  0 0 0 0 0.9  0 0 0 0.9 0'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>");
        }
        #nt-vignette {
          position: absolute; inset: 0; z-index: 6; pointer-events: none;
          background: radial-gradient(ellipse 75% 75% at 50% 48%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.5) 100%);
        }
        #nt-scene {
          position: absolute;
          inset: 0;
          z-index: 2;
        }
        #nt-card {
          position: absolute;
          left: 410px;
          top: 270px;
          width: 1100px;
          height: 540px;
          border-radius: 26px;
          background: #222429;
          border: 1px solid #33363d;
          box-shadow: 0 1px 1px rgba(0, 0, 0, 0.32), 0 3px 6px rgba(0, 0, 0, 0.2), 0 14px 30px rgba(0, 0, 0, 0.2), 0 50px 110px rgba(0, 0, 0, 0.44);
        }
        #nt-title {
          position: absolute;
          left: 72px;
          top: 64px;
          font-family: "Playfair Display", serif;
          font-size: 112px;
          font-weight: 600;
          letter-spacing: -0.01em;
          line-height: 120px;
          white-space: nowrap;
        }
        #nt-rule {
          position: absolute;
          left: 72px;
          right: 72px;
          top: 222px;
          height: 2px;
          background: #33363d;
        }
        #nt-strong {
          position: absolute;
          left: 72px;
          top: 262px;
          font-size: 36px;
          font-weight: 700;
          line-height: 48px;
          white-space: nowrap;
        }
        #nt-muted {
          position: absolute;
          left: 72px;
          top: 326px;
          font-size: 30px;
          font-weight: 400;
          line-height: 42px;
          color: #a3a7af;
          white-space: nowrap;
        }
        #nt-mono {
          position: absolute;
          left: 72px;
          top: 408px;
          font-family: "Space Mono", monospace;
          font-size: 28px;
          font-weight: 400;
          line-height: 40px;
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="night" data-width="1920" data-height="1080">
        <div id="nt-ground"></div>
        <div id="nt-light" data-layout-allow-overflow></div>
        <div
          id="nt-scene"
          class="clip"
          data-start="0"
          data-duration="6"
          data-track-index="0"
        >
          <div id="nt-card">
            <div id="nt-title">Night</div>
            <div id="nt-rule"></div>
            <div id="nt-strong">Interface text sits on the surface colour</div>
            <div id="nt-muted">Secondary text uses the muted colour</div>
            <div id="nt-mono">notes and code use the mono face</div>
          </div>
        </div>
        <div id="nt-glow" data-layout-allow-overflow></div>
        <div id="nt-grain"></div>
        <div id="nt-vignette"></div>
      </div>

      <script>
        (function () {
          var D = 6;
          var tl = gsap.timeline({ paused: true });
          // The stage light drifts at constant speed for the whole scene.
          tl.fromTo("#nt-light", { x: -150, y: -40 }, { x: 130, y: 30, duration: D, ease: "none" }, 0);
          tl.fromTo("#nt-glow", { x: 120, y: 0 }, { x: -260, y: 90, duration: D, ease: "none" }, 0);
          // The card settles in once, then is still.
          tl.fromTo("#nt-card", { scale: 1.04 }, { scale: 1, duration: 1.4, ease: "expo.out" }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["night"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
